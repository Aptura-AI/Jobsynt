<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>JobSynt Ghost Job Finder Options</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 2em; }
        label { display: block; margin-bottom: 0.5em; }
        input[type="text"] { width: 100%; padding: 0.5em; margin-bottom: 1em; }
        button { padding: 0.5em 1em; }
    </style>
</head>
<body>
    <h2>JobSynt Ghost Job Finder Options</h2>
    <form id="optionsForm">
        <label for="apiKey">Jobsynt API Key:</label>
        <input type="text" id="apiKey" name="apiKey" placeholder="Enter your API key" />
        <button type="submit">Save</button>
    </form>
    <p>Instructions: This extension uses AI to detect ghost jobs. Set your Jobsynt API key above.</p>
    <script>
        // Load saved API key
        document.addEventListener('DOMContentLoaded', () => {
            chrome.storage.sync.get(['apiKey'], (result) => {
                if (result.apiKey) {
                    document.getElementById('apiKey').value = result.apiKey;
                }
            });
        });
        // Save API key
        document.getElementById('optionsForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const apiKey = document.getElementById('apiKey').value;
            chrome.storage.sync.set({ apiKey }, () => {
                alert('API key saved!');
            });
        });
    </script>
</body>
</html>
