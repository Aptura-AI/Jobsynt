<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JobSynt Admin Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .admin-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 12px;
            padding: 1.5rem;
            color: white;
            transition: transform 0.2s ease;
        }
        .admin-card:hover {
            transform: translateY(-2px);
        }
        .status-badge {
            display: inline-flex;
            align-items: center;
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 500;
        }
        .status-active { background-color: #10b981; color: white; }
        .status-inactive { background-color: #ef4444; color: white; }
        .status-warning { background-color: #f59e0b; color: white; }
        .status-dormant { background-color: #6b7280; color: white; }
        .metric-card {
            background: white;
            border-radius: 8px;
            padding: 1.5rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            border: 1px solid #e5e7eb;
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">
    <!-- Header -->
    <header class="bg-white shadow-sm border-b">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-16">
                <div class="flex items-center">
                    <h1 class="text-2xl font-bold text-gray-900">
                        <i class="fas fa-cog text-blue-600 mr-2"></i>
                        JobSynt Admin Dashboard
                    </h1>
                </div>
                <div class="flex items-center space-x-4">
                    <button id="refreshBtn" class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 transition-colors">
                        <i class="fas fa-sync-alt mr-2"></i>Refresh Data
                    </button>
                    <div id="lastUpdated" class="text-sm text-gray-500"></div>
                </div>
            </div>
        </div>
    </header>

    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <!-- Diagnostic Section -->
        <div class="mb-8">
            <button id="diagnosticsBtn" class="bg-yellow-500 hover:bg-yellow-600 text-white px-4 py-2 rounded-lg">
                <i class="fas fa-stethoscope"></i> Run Diagnostics
            </button>
            <div id="diagnosticsResults" class="mt-4 hidden"></div>
        </div>

        <!-- Quick Stats -->
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-8">
            <div class="admin-card">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-blue-100 text-sm">Total Subscribers</p>
                        <p id="totalSubscribers" class="text-3xl font-bold">---</p>
                    </div>
                    <i class="fas fa-users text-4xl text-blue-200"></i>
                </div>
            </div>
            
            <div class="admin-card">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-blue-100 text-sm">Active Scrapers</p>
                        <p id="activeScrapers" class="text-3xl font-bold">---</p>
                    </div>
                    <i class="fas fa-robot text-4xl text-blue-200"></i>
                </div>
            </div>
            
            <div class="admin-card">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-blue-100 text-sm">Jobs Scraped (24h)</p>
                        <p id="jobsScraped24h" class="text-3xl font-bold">---</p>
                    </div>
                    <i class="fas fa-briefcase text-4xl text-blue-200"></i>
                </div>
            </div>
            
            <div class="admin-card">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-blue-100 text-sm">System Status</p>
                        <p id="systemStatus" class="text-xl font-bold">---</p>
                    </div>
                    <i class="fas fa-heartbeat text-4xl text-blue-200"></i>
                </div>
            </div>
        </div>

        <!-- Scrapers Status -->
        <div class="metric-card mb-8">
            <div class="flex items-center justify-between mb-4">
                <h3 class="text-lg font-semibold text-gray-900">Job Scrapers Status</h3>
            </div>
            <div id="scrapersStatus" class="space-y-3"></div>
        </div>

        <!-- Main Content Grid -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
            <!-- Subscribers Overview -->
            <div class="metric-card">
                <h3 class="text-lg font-semibold text-gray-900 mb-4">Recent Subscribers</h3>
                <div id="subscribersOverview" class="space-y-3">
                    <!-- Subscribers will be loaded here -->
                </div>
            </div>

            <!-- Database Stats -->
            <div class="metric-card">
                <h3 class="text-lg font-semibold text-gray-900 mb-4">Database Statistics</h3>
                <div id="databaseStats" class="space-y-4">
                    <!-- Database stats will be loaded here -->
                </div>
                <div class="mt-4 p-3 bg-green-50 border border-green-200 rounded-lg">
                    <p class="text-sm text-green-700">
                        <i class="fas fa-check-circle mr-2"></i>
                        <strong>Jobs ARE being saved to Supabase!</strong> The background-job-scraper saves to 'scraped_jobs' table.
                    </p>
                </div>
            </div>
        </div>

        <!-- Action Buttons -->
        <div class="flex flex-wrap gap-4 mt-8">
            <button id="manualScrapeBtn" class="bg-green-600 text-white px-6 py-3 rounded-lg hover:bg-green-700 transition-colors">
                <i class="fas fa-play mr-2"></i>Run Enhanced IT Contract Scrape
            </button>
            <button id="generalScrapeBtn" class="bg-blue-600 text-white px-6 py-3 rounded-lg hover:bg-blue-700 transition-colors">
                <i class="fas fa-briefcase mr-2"></i>Run General Scrape (BDM/Sales)
            </button>
            <button id="cleanupBtn" class="bg-red-600 text-white px-6 py-3 rounded-lg hover:bg-red-700 transition-colors">
                <i class="fas fa-trash mr-2"></i>Cleanup Old Jobs
            </button>
            <button id="viewJobsBtn" class="bg-indigo-600 text-white px-6 py-3 rounded-lg hover:bg-indigo-700 transition-colors">
                <i class="fas fa-eye mr-2"></i>View All Jobs
            </button>
            <button id="optimizeDbBtn" class="bg-purple-600 text-white px-6 py-3 rounded-lg hover:bg-purple-700 transition-colors">
                <i class="fas fa-database mr-2"></i>Optimize Database
            </button>
        </div>
        <div class="scraper-controls">
            <button id="run-it-scraper">Run Enhanced IT Contract Scraper</button>
            <span id="it-scraper-status"></span>
            <button id="run-crm-scraper">Run CRM Scraper</button>
            <span id="crm-scraper-status"></span>
        </div>
    </div>

    <!-- Loading Modal -->
    <div id="loadingModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
        <div class="bg-white p-6 rounded-lg shadow-lg">
            <div class="flex items-center">
                <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-blue-600 mr-3"></div>
                <span id="loadingText">Loading...</span>
            </div>
        </div>
    </div>

    <script>
        // Admin Dashboard JavaScript
        class AdminDashboard {
            constructor() {
                this.init();
                this.loadDashboardData();
                this.setupEventListeners();
                this.setupAutoRefresh();
            }

            init() {
                this.updateLastUpdatedTime();
            }

            setupEventListeners() {
                document.getElementById('refreshBtn').addEventListener('click', () => this.loadDashboardData());
                document.getElementById('manualScrapeBtn').addEventListener('click', () => this.runManualScrape('it'));
                document.getElementById('generalScrapeBtn').addEventListener('click', () => this.runManualScrape('crm'));
                document.getElementById('cleanupBtn').addEventListener('click', () => this.cleanupOldJobs());
                document.getElementById('viewJobsBtn').addEventListener('click', () => this.viewAllJobs());
                document.getElementById('optimizeDbBtn').addEventListener('click', () => this.optimizeDatabase());
                document.getElementById('run-it-scraper').addEventListener('click', () => this.runManualScrape('it'));
                document.getElementById('run-crm-scraper').addEventListener('click', () => this.runManualScrape('crm'));
            }

            setupAutoRefresh() {
                // Auto-refresh every 5 minutes
                setInterval(() => {
                    this.loadDashboardData();
                }, 300000);
            }

            async loadDashboardData() {
                this.showLoading('Loading dashboard data...');
                try {
                    await Promise.all([
                        this.loadQuickStats(),
                        this.loadScrapersStatus(),
                        this.loadSubscribers(),
                        this.loadDatabaseStats()
                    ]);
                    this.updateLastUpdatedTime();
                } catch (error) {
                    console.error('Error loading dashboard data:', error);
                    this.showError('Failed to load dashboard data');
                } finally {
                    this.hideLoading();
                }
            }

            async loadQuickStats() {
                try {
                    const stats = await this.fetchStats();
                    document.getElementById('totalSubscribers').textContent = stats.totalUsers || '---';
                    document.getElementById('activeScrapers').textContent = 2; // Always 2: IT + CRM
                    document.getElementById('jobsScraped24h').textContent = stats.jobsScraped24h || '---';
                    document.getElementById('systemStatus').textContent = stats.systemStatus || '---';
                } catch (error) {
                    console.error('Error loading quick stats:', error);
                }
            }

            async loadScrapersStatus() {
                // Only show the two real scrapers
                const scrapers = [
                    { name: 'Enhanced IT Contract Scraper', status: 'active', size: '18KB', lastRun: 'Auto/Manual', jobsScraped: '-', type: 'ACTIVE', description: 'Smart IT Contract Jobs - Targeting Dice, Indeed, LinkedIn, Upwork & FlexJobs' },
                    { name: 'CRM General Job Scraper', status: 'active', size: '16KB', lastRun: 'Auto/Manual', jobsScraped: '-', type: 'ACTIVE', description: 'General contract jobs (BDM, sales, marketing, etc.)' }
                ];
                const container = document.getElementById('scrapersStatus');
                container.innerHTML = scrapers.map(scraper => `
                    <div class="flex items-center justify-between p-3 bg-green-50 border border-green-200 rounded-lg">
                        <div class="flex items-center">
                            <i class="fas fa-robot text-green-600 mr-3"></i>
                            <div>
                                <div class="flex items-center gap-2">
                                    <p class="font-medium text-gray-900">${scraper.name}</p>
                                    <span class="px-2 py-1 text-xs bg-green-100 text-green-800 rounded-full">ACTIVE</span>
                                </div>
                                <p class="text-sm text-green-600">${scraper.description}</p>
                                <p class="text-xs text-gray-500">Size: ${scraper.size} • Last run: ${scraper.lastRun}</p>
                            </div>
                        </div>
                        <div class="text-right">
                            <span class="status-badge status-active">ACTIVE</span>
                            <p class="text-sm text-gray-500 mt-1">${scraper.jobsScraped} jobs</p>
                        </div>
                    </div>
                `).join('');
            }

            async loadSubscribers() {
                try {
                    const response = await fetch('/.netlify/functions/admin-subscribers');
                    let subscribers = [];
                    if (response.ok) {
                        const data = await response.json();
                        subscribers = data.subscribers || [];
                    }
                    const container = document.getElementById('subscribersOverview');
                    if (subscribers.length === 0) {
                        container.innerHTML = `
                            <div class="flex items-center justify-center p-8 bg-gray-50 rounded-lg">
                                <div class="text-center">
                                    <i class="fas fa-users text-gray-400 text-4xl mb-4"></i>
                                    <p class="text-gray-600 font-medium">No subscribers yet</p>
                                    <p class="text-sm text-gray-500">Real subscriber data will appear here</p>
                                </div>
                            </div>
                        `;
                        return;
                    }
                    container.innerHTML = subscribers.map(sub => `
                        <div class="flex items-center justify-between p-3 bg-gray-50 rounded-lg">
                            <div class="flex items-center">
                                <div class="w-8 h-8 bg-blue-600 rounded-full flex items-center justify-center text-white text-sm font-bold mr-3">
                                    ${sub.name ? sub.name.charAt(0).toUpperCase() : '?'}
                                </div>
                                <div>
                                    <p class="font-medium text-gray-900">${sub.name || 'Unknown User'}</p>
                                    <p class="text-sm text-gray-500">${sub.email || 'No email'}</p>
                                </div>
                            </div>
                            <div class="text-right">
                                <span class="status-badge ${sub.plan === 'Free' ? 'status-warning' : 'status-active'}">${sub.plan || 'Free'}</span>
                                <p class="text-sm text-gray-500 mt-1">${sub.jobs || 0} matched jobs</p>
                            </div>
                        </div>
                    `).join('');
                } catch (error) {
                    console.error('Error loading subscribers:', error);
                    const container = document.getElementById('subscribersOverview');
                    container.innerHTML = `
                        <div class="flex items-center justify-center p-8 bg-gray-50 rounded-lg">
                            <div class="text-center">
                                <i class="fas fa-exclamation-triangle text-yellow-500 text-4xl mb-4"></i>
                                <p class="text-gray-600 font-medium">Unable to load subscribers</p>
                                <p class="text-sm text-gray-500">Check backend connection</p>
                            </div>
                        </div>
                    `;
                }
            }

            async loadDatabaseStats() {
                try {
                    const response = await fetch('/.netlify/functions/admin-database-stats');
                    let stats = [];
                    if (response.ok) {
                        const data = await response.json();
                        stats = data.stats || [];
                    } else {
                        stats = [
                            { table: 'scraped_jobs', count: 0, size: '0 KB', description: 'All scraped job data' },
                            { table: 'profiles', count: 0, size: '0 KB', description: 'User profiles' },
                            { table: 'profile_matched_jobs', count: 0, size: '0 KB', description: 'Job matches per user' },
                            { table: 'daily_job_recommendations', count: 0, size: '0 KB', description: 'Daily recommendations' },
                            { table: 'favorite_companies', count: 0, size: '0 KB', description: 'User favorite companies' }
                        ];
                    }
                    const container = document.getElementById('databaseStats');
                    container.innerHTML = stats.map(stat => `
                        <div class="flex justify-between items-center p-3 bg-gray-50 rounded-lg">
                            <div>
                                <p class="font-medium text-gray-900">${stat.table}</p>
                                <p class="text-sm text-gray-500">${stat.description}</p>
                            </div>
                            <div class="text-right">
                                <span class="text-lg font-bold">${stat.count}</span>
                                <p class="text-xs text-gray-400">${stat.size}</p>
                            </div>
                        </div>
                    `).join('');
                } catch (error) {
                    console.error('Error loading database stats:', error);
                }
            }

            async runManualScrape(type) {
                let endpoint = '';
                let statusSpan = null;
                if (type === 'it') {
                    endpoint = '/.netlify/functions/smart-job-scraper?manualTrigger=true';
                    statusSpan = document.getElementById('it-scraper-status');
                } else if (type === 'crm') {
                    endpoint = '/.netlify/functions/crm-job-scraper?manualTrigger=true';
                    statusSpan = document.getElementById('crm-scraper-status');
                }
                if (!endpoint || !statusSpan) return;
                statusSpan.textContent = 'Running...';
                try {
                    const response = await fetch(endpoint);
                    if (response.ok) {
                        const data = await response.json();
                        statusSpan.textContent = 'Done!';
                    } else {
                        statusSpan.textContent = 'Failed!';
                    }
                } catch (error) {
                    statusSpan.textContent = 'Error!';
                }
                setTimeout(() => { statusSpan.textContent = ''; }, 4000);
            }

            showLoading(text) {
                document.getElementById('loadingModal').classList.remove('hidden');
                document.getElementById('loadingText').textContent = text || 'Loading...';
            }
            hideLoading() {
                document.getElementById('loadingModal').classList.add('hidden');
            }
            showError(text) {
                alert(text);
            }
            updateLastUpdatedTime() {
                document.getElementById('lastUpdated').textContent = 'Last updated: ' + new Date().toLocaleTimeString();
            }
            viewAllJobs() {
                window.open('https://app.supabase.com/project/' + (window.SUPABASE_PROJECT_ID || ''), '_blank');
            }
            cleanupOldJobs() {
                alert('Cleanup not implemented yet.');
            }
            optimizeDatabase() {
                alert('Optimize not implemented yet.');
            }
            consolidateScrapers() {
                // Remove consolidation logic
            }

            async fetchStats() {
                const response = await fetch('/.netlify/functions/admin-stats');
                if (response.ok) {
                    return await response.json();
                }
                return { totalUsers: 0, activeScrapers: 2, jobsScraped24h: 0, systemStatus: 'Unknown' };
            }
        }

        // Initialize dashboard when page loads
        document.addEventListener('DOMContentLoaded', () => {
            new AdminDashboard();
            
            // Add diagnostics button handler
            document.getElementById('diagnosticsBtn').addEventListener('click', async () => {
                const btn = document.getElementById('diagnosticsBtn');
                const resultsDiv = document.getElementById('diagnosticsResults');
                
                btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Running...';
                btn.disabled = true;
                
                try {
                    const response = await fetch('/.netlify/functions/admin-diagnostics');
                    const data = await response.json();
                    
                    resultsDiv.innerHTML = `
                        <div class="bg-gray-100 p-4 rounded-lg">
                            <h4 class="font-bold mb-2">System Diagnostics</h4>
                            <pre class="text-sm overflow-auto">${JSON.stringify(data, null, 2)}</pre>
                        </div>
                    `;
                    resultsDiv.classList.remove('hidden');
                    
                } catch (error) {
                    resultsDiv.innerHTML = `
                        <div class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded">
                            <strong>Diagnostics Error:</strong> ${error.message}
                        </div>
                    `;
                    resultsDiv.classList.remove('hidden');
                } finally {
                    btn.innerHTML = '<i class="fas fa-stethoscope"></i> Run Diagnostics';
                    btn.disabled = false;
                }
            });
        });
    </script>

    <!-- Add favicon if missing -->
    <link rel="icon" href="/favicon.ico" />
</body>
</html>
