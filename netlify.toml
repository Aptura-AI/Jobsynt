[build]
  command = "npm install"
  publish = "."
  functions = "netlify/functions"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  external_node_modules = ["axios", "cheerio", "@supabase/supabase-js"]

[context.production.environment]
  NODE_VERSION = "18.17.0"

[[redirects]]
  from = "/dashboard"
  to = "/dashboard.html"
  status = 200

[[redirects]]
  from = "/index"
  to = "/index.html"
  status = 200

# Scheduled Functions
[functions.background-job-cron]
  schedule = "0 */30 * * *"  # Every 30 minutes - IT C2C Scraper

[functions.general-job-scraper]
  schedule = "0 */45 * * *"  # Every 45 minutes - General Jobs (BDM, Sales, etc.)