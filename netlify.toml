[build]
  command = "npm install"
  publish = "."
  functions = "netlify/functions"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  external_node_modules = ["axios", "cheerio", "@supabase/supabase-js"]

[context.production.environment]
  NODE_VERSION = "18.x"

[[redirects]]
  from = "/dashboard"
  to = "/dashboard.html"
  status = 200

[[redirects]]
  from = "/index"
  to = "/index.html"
  status = 200