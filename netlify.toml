[build]
  command = "npm install && npm run build"
  publish = "."
  functions = "netlify/functions"
  ignore_python = true

[dev]
  framework = "#static"
  targetPort = 8888
  functionsPort = 3999
  publish = "."
  port = 3000
  autoLaunch = true

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  external_node_modules = ["axios", "cheerio", "redis", "@supabase/supabase-js"]

# Scheduled function to run background job scraper every 2 hours
[[functions]]
  schedule = "0 */2 * * *"
  name = "background-job-cron"

[context.production.environment]
  NODE_VERSION = "18.x"

[[headers]]
  for = "/*.js"
  [headers.values]
    Content-Type = "application/javascript"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self' https://yhrwamhdiiggsapmfwas.supabase.co https://accounts.google.com; script-src 'self' 'unsafe-inline' 'unsafe-eval' cdnjs.cloudflare.com cdn.jsdelivr.net https://yhrwamhdiiggsapmfwas.supabase.co; style-src 'self' 'unsafe-inline' cdnjs.cloudflare.com; img-src 'self' data: blob:; connect-src 'self' https://yhrwamhdiiggsapmfwas.supabase.co https://accounts.google.com https://api.linkedin.com; font-src 'self' cdnjs.cloudflare.com; frame-src 'self' https://accounts.google.com"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"

[[redirects]]
  from = "/dashboard"
  to = "/dashboard.html"
  status = 200

[[redirects]]
  from = "/index"
  to = "/index.html"
  status = 200