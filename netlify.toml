[build]
  command = "npm install"
  publish = "."
  functions = "netlify/functions"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  external_node_modules = ["axios", "cheerio", "@supabase/supabase-js"]

[functions."smart-job-scraper"]
schedule = "*/15 * * * *"

[functions."crm-job-scraper"]
schedule = "*/15 * * * *"

[context.production.environment]
  NODE_VERSION = "18.17.0"

[[redirects]]
  from = "/dashboard"
  to = "/dashboard.html"
  status = 200

[[redirects]]
  from = "/index"
  to = "/index.html"
  status = 200

# 24/7 Enhanced Smart Job Scraper - The ONLY scraper needed
[functions.background-job-cron]
  schedule = "0 */15 * * *"  # Every 15 minutes - Enhanced Smart IT Contract Scraper targeting Dice, Indeed, LinkedIn, Upwork & FlexJobs

# ALL OTHER SCRAPERS DELETED - Single enhanced scraper handles everything intelligently

[build.environment]
  SECRETS_SCAN_OMIT_PATHS = "dashboard.html,index.html,public/js/config.js"